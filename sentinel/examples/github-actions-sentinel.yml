name: GILGAL Sentinel example

on:
  pull_request:

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sentinel/package-lock.json
      - run: npm ci
        working-directory: sentinel
      - run: npm run build
        working-directory: sentinel
      - name: GILGAL Sentinel
        run: node sentinel/dist/src/cli.js sentinel check --config gilgal.sentinel.json
